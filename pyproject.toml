[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mv-agent"
version = "0.1.0"
description = "Agent-ready M&V Specialist toolkit for federal energy management"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Matt Schreck" }
]

dependencies = [
    "pydantic>=2.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
    "pandas>=2.2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "black>=24.0",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
